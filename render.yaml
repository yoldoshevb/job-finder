services:
  - type: python
    namsmart-job-finder
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    region: singapore
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_IDS
        sync: false
